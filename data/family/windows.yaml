---
gitlab_ci_runner::install_method: 'binary'
gitlab_ci_runner::binary_source: 'https://gitlab-runner-downloads.s3.amazonaws.com/latest/binaries/gitlab-runner-windows-amd64.exe'
gitlab_ci_runner::binary_path: 'C:/gitlab-runner/gitlab-runner.exe'
gitlab_ci_runner::config_path: 'C:/gitlab-runner/config.toml'
gitlab_ci_runner::manage_repo: false
gitlab_ci_runner::docker_images: 
  nanoserver:
    image: "mcr.microsoft.com/windows/nanoserver"
    image_tag: "ltsc%{facts['os']['release']['major']}"
