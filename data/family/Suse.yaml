---
gitlab_ci_runner::install_method: 'binary'
gitlab_ci_runner::binary_source: 'https://gitlab-runner-downloads.s3.amazonaws.com/latest/binaries/gitlab-runner-linux-amd64'
gitlab_ci_runner::binary_path: '/usr/local/bin/gitlab-runner'
gitlab_ci_runner::config_path: '/etc/gitlab-runner/config.toml'
gitlab_ci_runner::manage_repo: false
gitlab_ci_runner::manage_config_dir: true
gitlab_ci_runner::manage_user: true
gitlab_ci_runner::docker_images: 
  ubuntu_focal:
    image: ubuntu
    image_tag: focal
